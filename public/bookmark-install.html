<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark · 安装抓链书签</title><link rel="icon" type="image/svg+xml" href="/shark-fin.svg"><link rel="stylesheet" href="/styles.css"><script type="module" src="/bookmark-install.js"></script></head>
<body class="bookmark-install-page"><main class="app-shell"><section class="card">
<h1 id="bookmark-install-heading">把抓链按钮拖进书签栏</h1>
<p id="bookmark-install-intro">只需拖入一次。以后在已登录的迅雷或百度网盘点击书签，再点影片播放或下载。</p>
<p id="bookmark-install-shortcuts">Chrome／Edge 可按 <kbd>⌘⇧B</kbd>（Mac）或 <kbd>Ctrl+Shift+B</kbd>（Windows）显示书签栏。</p>
<p id="bookmark-install-edge-shortcut" hidden>在 Edge 按 <kbd>Ctrl+Shift+B</kbd> 显示收藏夹栏。</p>
<p><a id="bookmark-install-link" class="bookmark-capture-link" draggable="true" href="#" aria-disabled="true"><img class="bookmark-brand-icon" src="/shark-fin.svg" alt="" width="14" height="14" draggable="false">片段取材抓链</a></p>
<p id="bookmark-install-state" role="status">正在准备本机书签…</p>
<p class="field-hint">拖好后可关闭本页。抓链时保持 Shark 打开。</p>
<details><summary>已装过旧书签</summary><p class="field-hint">旧书签可继续使用。网盘浮层缺少 × 时，替换书签并刷新网盘页面。</p></details>
</section></main></body></html>
