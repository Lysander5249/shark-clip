name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The suite generates fixtures with FFmpeg and needs libx264, so it uses
      # the distribution FFmpeg here. The shipped LGPL build deliberately omits
      # libx264 and is validated by the packaging workflow instead.
      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # TAP is pinned so the failing-test names can be parsed the same way on
      # every Node version; the log stays on disk for the reporting step below.
      - name: Core regression
        shell: bash
        run: node --test --test-reporter=tap --test-concurrency=1 test/*.test.mjs > core-regression.tap 2>&1

      # Workflow annotations are readable without repository access, which is how
      # an outside contributor can see what broke without downloading the logs.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          if [ ! -f core-regression.tap ]; then exit 0; fi
          grep -E '^not ok ' core-regression.tap | head -n 20 | while IFS= read -r line; do
            name=$(printf '%s' "$line" | sed -E 's/^not ok [0-9]+ - //')
            echo "::error title=Failing test::${name}"
          done
          grep -E '^# (tests|pass|fail)' core-regression.tap | while IFS= read -r line; do
            echo "::notice title=Summary::${line}"
          done

      - name: Upload regression log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-regression-${{ matrix.os }}-node${{ matrix.node }}
          path: core-regression.tap
          retention-days: 7

      - name: Desktop regression
        run: npm run test:desktop
