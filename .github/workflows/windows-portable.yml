name: Windows portable test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Preserve LF for MSYS2 scripts
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Test desktop launch boundaries and release target rejection
        shell: pwsh
        run: |
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The full media suite currently uses libx264 fixture generation and a
      # POSIX executable fixture. Port those tests before enabling npm test on
      # Windows; the LGPL distributable deliberately does not contain libx264.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            make
            curl
            tar
            xz
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
      - name: Build LGPL FFmpeg from pinned source
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-windows.sh
      - name: Package independent Node runtime and application
        shell: pwsh
        env:
          CLIP_FETCHER_UCRT64_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: ./scripts/build-windows.ps1
      - name: Smoke test the bundled runtime and local extraction
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Directory | Where-Object { $_.Name -like '*windows-x64*' } | Select-Object -First 1
          node scripts/smoke-package.mjs $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: clip-fetcher-windows-x64-unsigned-test
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
